<!doctype html>
<html lang="de" data-resolution="portrait">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>04 MINO QUEST</title>
<link rel="stylesheet" href="lib/base.css">
<script src="lib/gsap.min.js"></script>
<script src="lib/three.min.js"></script>
<script src="lib/mv.js"></script>
<script src="lib/cast.js"></script>
<script src="lib/props.js"></script>
<script src="audio/vo_04.js"></script>
<style>
  /* WELT-RAHMEN "MINO QUEST": Der Minoverse ist ein 90er-Point-and-Click-Adventure. Konstanten: Verb-Leiste
     (Gib, Öffne, Schließe, Nimm, Schau an, Rede mit, Benutze, Drück, ISS), Satzzeile, Inventar, Fadenkreuz-Cursor,
     farbiger Dialogtext über den Figuren, grob gepixelte 3D-Szenen pro Ort, Paletten-Zyklus als Fieber.
     Mino Man ist die Spielfigur. Jeder Ort im Minoverse ist ein Bildschirm. */
  #sky { background: linear-gradient(180deg, #1a0838 0%, #4a1a6a 45%, #c0508a 75%, #f2a05a 100%); }
  #stars { position: absolute; inset: 0; }
  #stars i { position: absolute; width: 8px; height: 8px; background: #fff; }
  #moon { position: absolute; left: 700px; top: 170px; width: 260px; height: 110px; border-radius: 60px; background: #f2d28a; box-shadow: 0 0 60px #f2d28a; transform: rotate(-18deg); }
  #moon::after { content: ''; position: absolute; left: 20px; right: 20px; top: 36px; height: 38px; border-radius: 20px; background: #c86a3a; }
  #gl { position: absolute; inset: 0; }
  .say { position: absolute; font: 700 50px 'Pixelify Sans'; text-align: center; width: 760px; margin-left: -380px; line-height: 1.1;
    text-shadow: 4px 0 0 #000, -4px 0 0 #000, 0 4px 0 #000, 0 -4px 0 #000, 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000; opacity: 0; }
  #ui { position: absolute; left: 0; right: 0; top: 1440px; bottom: 0; background: #180c2a; border-top: 8px solid #5a3a8a; }
  #sent { position: absolute; left: 0; right: 0; top: 14px; text-align: center; font: 700 46px 'Pixelify Sans'; color: #6ef0ff; }
  #verbs { position: absolute; left: 24px; top: 92px; width: 600px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
  #verbs span { font: 700 44px 'Pixelify Sans'; color: #3fa04a; padding: 8px 6px; text-align: center; background: #22123a; border: 4px solid #2f1a4e; }
  #verbs span.on { color: #ffe34a; border-color: #ffe34a; }
  #inv { position: absolute; right: 24px; top: 92px; width: 410px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  #inv div { height: 130px; background: #22123a; border: 4px solid #2f1a4e; position: relative; }
  #inv div.on { border-color: #ffe34a; }
  #inv canvas { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); image-rendering: pixelated; }
  #cross { position: absolute; left: 0; top: 0; width: 70px; height: 70px; margin: -35px 0 0 -35px; z-index: 40; }
  #cross::before, #cross::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 0 3px #000; }
  #cross::before { left: 32px; top: 0; width: 6px; height: 70px; }
  #cross::after { left: 0; top: 32px; width: 70px; height: 6px; }
  #title { position: absolute; left: 30px; top: 40px; font: 700 40px 'Pixelify Sans'; color: #f2d28a; text-shadow: 3px 3px 0 #000; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12.8" data-width="1080" data-height="1920">
  <audio id="music" data-start="0" data-duration="12.8" data-track-index="9" src="audio/04.mp3"></audio>
  <div id="sky" class="clip"><div id="stars"></div><div id="moon"></div></div>
  <div id="gl"></div>
  <div id="title">VOR DER HOT-DOG-FABRIK · NACHTS</div>
  <div class="say" id="sayMM" style="color:#ffffff"></div>
  <div class="say" id="sayMU" style="color:#d6ff5a"></div>
  <div class="say" id="sayGM" style="color:#ff8fd0"></div>
  <div class="say" id="sayCG" style="color:#ffb35a"></div>
  <div id="ui">
    <div id="sent"></div>
    <div id="verbs"></div>
    <div id="inv"></div>
  </div>
  <div id="cross"></div>
</div>
<script>
  const B = MV.b, DROP = MV.DROP, $ = (id) => document.getElementById(id);
  // Sterne
  for (let i = 0; i < 40; i++) { const s = document.createElement('i'); s.style.left = MV.hash(i) * 1080 + 'px'; s.style.top = MV.hash(i + 40) * 700 + 'px'; $('stars').appendChild(s); }
  // ---------- Oberfläche ----------
  const VERBS = ['Gib', 'Öffne', 'Schließe', 'Nimm', 'Schau an', 'Rede mit', 'Benutze', 'Drück', 'ISS'];
  const FEVER_VERBS = ['Tanze', 'Frittiere', 'Regne', 'Vergiss', 'Melde', 'Kaue', 'Zappe', 'Glaube', 'ISS'];
  const verbEls = VERBS.map((v) => { const e = document.createElement('span'); e.textContent = v; $('verbs').appendChild(e); return e; });
  // Inventar-Symbole als Pixel-Zeichnungen
  const ICONS = {
    mentos: ['................', '................', '......####......', '....##oooo##....', '...#oooooooo#...', '...#oooooooo#...', '...#oooooooo#...', '....##oooo##....', '......####......', '................'],
    akte: ['................', '..########......', '..#yyyyyy###....', '..#yyyyyyyyy#...', '..#ywwwwwwwy#...', '..#ywkkkkkwy#...', '..#ywwwwwwwy#...', '..#ywkkkwwwy#...', '..#yyyyyyyyy#...', '..###########...'],
    hotdog: ['................', '................', '..bbbbbbbbbbbb..', '.bbrrrrrrrrrrbb.', '.rrrrrrrrrrrrrr.', '.bbyyyyyyyyyybb.', '..bbbbbbbbbbbb..', '................', '................', '................'],
    freq: ['................', '.......c........', '...c...c...c....', '...c..ccc..c..c.', '.c.cc.ccc.cc..c.', '.ccccccccccccccc', '.c.cc.ccc.cc..c.', '...c..ccc..c..c.', '...c...c...c....', '.......c........'],
    ausweis: ['................', '.wwwwwwwwwwwwww.', '.w####wwkkkkkkw.', '.w#ss#wwwwwwwww.', '.w#ss#wwkkkkwww.', '.w####wwwwwwwww.', '.wwwwwwwkkkkkkw.', '.wrrrrrrrrrrrrw.', '.wwwwwwwwwwwwww.', '................'],
    ente: ['................', '..........yyy...', '.........yyyyo..', '.........yyyy...', '...yyyyyyyyy....', '..yyyyyyyyyyy...', '..yyyyyyyyyyy...', '...yyyyyyyyy....', '................', '................'],
  };
  const COL = { '#': '#3a2a1a', o: '#f2f2ea', y: '#e8c45a', w: '#f4efe2', k: '#555', b: '#d99a4a', r: '#b5482c', c: '#6ef0ff', s: '#e8b597' };
  const INV = ['mentos', 'akte', 'hotdog', 'freq', 'ausweis', 'ente'];
  const invEls = INV.map((k) => {
    const d = document.createElement('div'); const cv = document.createElement('canvas'); cv.width = 16; cv.height = 10;
    const g = cv.getContext('2d'); ICONS[k].forEach((row, y) => row.split('').forEach((c, x) => { if (COL[c]) { g.fillStyle = COL[c]; g.fillRect(x, y, 1, 1); } }));
    d.appendChild(cv); $('inv').appendChild(d); return d;
  });
  // ---------- 3D-Ort: Fabrik bei Nacht, grob gepixelt ----------
  MC.style = 'flat';
  const st = MC.stage($('gl'), { w: 1080, h: 1920, pix: 5, hemi: 0.7, keyI: 1.1, key: '#ffd9b0', rim: '#ff6fd0', rimI: 1.0, sky: '#b9a0ff', ground: '#3a2050' });
  const T3 = THREE, scene = st.scene;
  const cam = new T3.PerspectiveCamera(30, 9 / 16, 0.1, 100);
  MP.floor(scene, '#5a4a6a', '#4a3a5a', 24, 30);
  // Fassade
  MC.add(scene, MC.geo.box(5.5, 3.6, 0.5), MC.mat('#8a6a7a'), [0, 1.8, -1.6]);
  for (let i = 0; i < 4; i++) MC.add(scene, MC.geo.box(0.7, 0.55, 0.05), new T3.MeshBasicMaterial({ color: i === 2 ? '#ffe9a0' : '#2a1a3a' }), [-2 + i * 1.3 + (i > 1 ? 0.6 : 0), 2.6, -1.33]);
  const sign = MC.add(scene, new T3.PlaneGeometry(2.6, 0.5), new T3.MeshBasicMaterial({ map: MP.textTex('HOT-DOG-FABRIK', { w: 512, h: 96, bg: '#2a1a3a', fg: '#ff5a5a', font: '700 64px "Pixelify Sans"' }) }), [0, 3.25, -1.33]);
  const doorL = MC.add(scene, MC.geo.box(0.6, 1.5, 0.08), MC.mat('#4a2a1a'), [0.3, 0.75, -1.3]);
  const doorR = MC.add(scene, MC.geo.box(0.6, 1.5, 0.08), MC.mat('#4a2a1a'), [0.9, 0.75, -1.3]);
  const doorGlow = MC.add(scene, new T3.PlaneGeometry(1.2, 1.5), new T3.MeshBasicMaterial({ color: '#ffd04a' }), [0.6, 0.75, -1.34]);
  // Laterne, Zaun, Busch
  MC.add(scene, MC.geo.cyl(0.04, 0.05, 2.4, 6), MC.mat('#2a2a35'), [-2.0, 1.2, -0.6]);
  const lampHead = MC.add(scene, MC.geo.box(0.25, 0.3, 0.25), new T3.MeshBasicMaterial({ color: '#ffe9a0' }), [-2.0, 2.45, -0.6]);
  for (let i = 0; i < 9; i++) MC.add(scene, MC.geo.box(0.06, 0.7, 0.06), MC.mat('#c8b8d8'), [1.4 + i * 0.25, 0.35, -0.9]);
  MC.add(scene, MC.geo.box(2.2, 0.06, 0.05), MC.mat('#c8b8d8'), [2.4, 0.55, -0.9]);
  const bush = MC.add(scene, MC.geo.ico(0.55, 0), MC.mat('#3a7a4a'), [-1.85, 0.35, -0.75], null, [1.3, 0.8, 0.9]);
  // Figuren
  const mm = MC.make('minoman'), mu = MC.make('munch'), gm = MC.make('grandma'), cg = MC.make('chickenguy');
  [mm, mu, gm, cg].forEach((h) => scene.add(h.root));
  mu.root.position.set(1.55, 0, -0.35);
  gm.root.position.set(-1.15, 0, -0.2);
  const foam = MP.foam(scene, 140, 2);
  const foam2 = MP.foam(scene, 100, 6);
  // Sprechtexte: [Figur, t0, t1, Text]
  const SAY = [
    ['MM', 0.3, 1.5, 'Wo ist Chicken Guy?'],
    ['MU', 1.8, 3.2, 'Welche Akte?'],
    ['GM', B(7.2), DROP, 'Oh. Danke.'],
    ['CG', B(9), B(11), 'AAAAAAAAH!'],
    ['MM', B(11), B(13), 'Er sieht irgendwie anders aus.'],
    ['MU', B(13), B(15.5), '*kaut die Akte*'],
    ['GM', B(16.8), B(19), 'Noch eine!'],
    ['CG', B(20), B(22), 'AAAAAAAAH!'],
    ['MM', B(23), B(25.5), 'Ich bin Mino Man.'],
    ['MM', B(28), B(31), 'Das kann ich nicht essen.'],
  ];
  const sayEl = { MM: $('sayMM'), MU: $('sayMU'), GM: $('sayGM'), CG: $('sayCG') };
  const who = { MM: mm, MU: mu, GM: gm, CG: cg };
  // Satzzeile + Cursor: [Schlag, Satz, Verb-Index oder -1, Inventar-Index oder -1, Cursor x, y]
  const STEPS = [
    [0, 'Rede mit Officer Munch', 5, -1, 760, 1080],
    [4, 'Benutze', 6, -1, 120, 1710],
    [5, 'Benutze Mentos mit', 6, 0, 740, 1640],
    [6.5, 'Benutze Mentos mit Pepsi Grandma', 6, 0, 330, 1050],
    [9, 'Schau an Chicken Guy', 4, -1, 640, 1000],
    [13, 'Nimm Akte', 3, 1, 880, 1640],
    [15, 'Officer Munch hat die Akte gegessen.', -1, -1, 880, 1300],
    [19, 'Tanze mit allen', 0, -1, 540, 1100],
    [26, 'Iss Hot Dog', 8, 2, 1010, 1640],
    [30, 'Rede mit Officer Munch', 5, -1, 760, 1080],
  ];
  const sent = $('sent'), cross = $('cross'), skyEl = $('sky'), glc = st.canvas;
  const tl = gsap.timeline({ paused: true });
  MV.onFrame((t) => {
    const beat = t / MV.BEAT, after = MV.after(t);
    const fever = MV.clamp((beat - 18.5) / 1.5, 0, 1) * MV.clamp((26 - beat) / 1.5, 0, 1);
    // Mino Man geht im Aufbau zu Pepsi Grandma, später zurück
    const walk1 = MV.clamp((t - B(4.5)) / B(2.5), 0, 1), walk2 = MV.clamp((t - B(26)) / B(2), 0, 1);
    const mx = MV.lerp(MV.lerp(0.35, -0.45, MV.ease.inout(walk1)), 0.35, MV.ease.inout(walk2));
    mm.root.position.set(mx, 0, 0.35);
    const walking = (walk1 > 0 && walk1 < 1) || (walk2 > 0 && walk2 < 1);
    const mmTalk = MV.talkAny(['4a', '4c'], t);
    MC.move(mm, beat * 1.5, walking ? 'walk' : fever > 0.3 ? 'twostep' : 'idle', { yaw: walking ? (walk2 > 0 ? Math.PI / 2 : -Math.PI / 2) : -0.25, k: fever > 0.3 ? 0.5 : 1 });
    MC.face(mm, t, mmTalk || (t > B(23) && t < B(25.5) ? 0.4 * Math.abs(Math.sin(t * 11)) : 0) || (t > B(11) && t < B(13) ? 0.4 * Math.abs(Math.sin(t * 12)) : 0), 0);
    // Officer Munch kaut neben der Tür
    MC.move(mu, beat, fever > 0.3 ? 'runningman' : 'eat', { yaw: -0.5, k: 0.6 });
    MC.face(mu, t, Math.max(MV.talk('4b', t), 0.3 * Math.max(0, Math.sin(t * 13))), 0);
    mu.j.folder.scale.y = 1 - 0.9 * MV.clamp((t - B(13)) / B(2.5), 0, 1);
    // Pepsi Grandma: Mentos rein auf den Drop, dann die Fontäne
    const gmv = t < B(6.5) ? 'idle' : t < DROP ? 'drop' : t < B(12) ? 'blast' : t < B(16.8) ? 'shake' : t < B(19) ? 'blast' : fever > 0.3 ? 'wave' : 'idle';
    MC.move(gm, beat, gmv, { yaw: 0.35 });
    MC.face(gm, t, MV.talk('4d', t) || (gmv === 'blast' ? 0.8 : 0.1), gmv === 'blast' ? 1 : 0.4);
    gm.root.updateMatrixWorld(true);
    const cap = gm.cap.getWorldPosition(new T3.Vector3());
    foam(t, DROP, cap, 1.3, 2.2);
    foam2(t, B(17), cap, 1.5, 1.8);
    // Tür fliegt auf, Chicken Guy rennt heraus
    const door = MV.ease.back(MV.clamp((t - DROP) / 0.25, 0, 1), 2);
    doorL.rotation.y = -1.9 * door; doorR.rotation.y = 1.9 * door;
    doorL.position.x = 0.3 - 0.3 * door; doorR.position.x = 0.9 + 0.3 * door;
    doorGlow.material.color.setHSL(after ? (t * 0.5) % 1 : 0.12, 1, 0.6);
    cg.root.visible = after;
    const cgOut = MV.clamp((t - DROP) / 0.5, 0, 1);
    cg.root.position.set(0.6 + 0.15 * Math.sin(t * 3) * cgOut, 0, MV.lerp(-1.3, -0.25, MV.ease.out(cgOut)));
    MC.move(cg, beat, cgOut < 1 ? 'runningman' : beat > 19 && beat < 26 ? 'twerk' : 'flap', { yaw: 0.3 * Math.sin(t * 2) });
    MC.face(cg, t, (t > B(9) && t < B(11)) || (t > B(20) && t < B(22)) ? 1 : 0.5, 1);
    lampHead.material.color.set(fever > 0 ? `hsl(${(t * 300) % 360},100%,70%)` : '#ffe9a0');
    // Kamera: Adventure-Seitenansicht, leichter Schwenk mit Mino Man
    const pulse = after ? MV.pulse(t, 7, 1, DROP) : 0;
    cam.position.set(mx * 0.25, 2.3, 13 - 0.3 * pulse);
    cam.lookAt(mx * 0.25, 1.15, 0);
    // Paletten-Zyklus (Fieber) auf Szene und Himmel
    const cyc = fever > 0 ? `hue-rotate(${(Math.floor(t * 8) * 45) % 360}deg) saturate(1.6)` : after ? `hue-rotate(${Math.sin(t * 2) * 20}deg)` : 'none';
    glc.style.filter = cyc; skyEl.style.filter = cyc;
    st.render(scene, cam);
    // Sprechtexte über den Köpfen
    Object.values(sayEl).forEach((e) => (e.style.opacity = 0));
    SAY.forEach(([w, t0, t1, txt]) => {
      if (t < t0 || t >= t1) return;
      const h = who[w], e = sayEl[w];
      const p = h.j.head.getWorldPosition(new T3.Vector3()); p.y += 0.55;
      const v = p.project(cam);
      e.textContent = txt; e.style.opacity = 1;
      e.style.left = MV.clamp((v.x * 0.5 + 0.5) * 1080, 390, 690) + 'px';
      e.style.top = MV.clamp((-v.y * 0.5 + 0.5) * 1920 - 120, 130, 1300) + 'px';
    });
    // Satzzeile, Verben, Inventar, Cursor
    let si = 0; for (let k = 0; k < STEPS.length; k++) if (beat >= STEPS[k][0]) si = k;
    const S = STEPS[si], P = STEPS[Math.max(0, si - 1)];
    sent.textContent = S[1];
    verbEls.forEach((e, i) => { e.className = i === S[2] ? 'on' : ''; e.textContent = fever > 0.3 ? FEVER_VERBS[i] : VERBS[i]; });
    invEls.forEach((e, i) => { e.className = i === S[3] ? 'on' : ''; e.style.visibility = i === 1 && t > B(15) && t < B(30) ? 'hidden' : 'visible'; });
    const ck = MV.ease.out(MV.clamp((t - B(S[0])) / 0.28, 0, 1));
    const jit = fever * 30 * Math.sin(t * 17);
    cross.style.transform = `translate(${MV.lerp(P[4], S[4], ck) + jit}px, ${MV.lerp(P[5], S[5], ck) + jit}px) scale(${1 - 0.25 * MV.imp(t, B(S[0]) + 0.28, 0.08)})`;
  });
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = tl;
  MV.register('main', tl);
</script>
</body>
</html>
