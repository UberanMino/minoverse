<!doctype html>
<html lang="de" data-resolution="portrait">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>07 Großwetterlage</title>
<link rel="stylesheet" href="lib/base.css">
<script src="lib/gsap.min.js"></script>
<script src="lib/mv.js"></script>
<style>
  #map { left: 0; top: 0; width: 1080px; height: 1920px; }
  #hdr { left: 0; right: 0; top: 60px; height: 120px; background: linear-gradient(90deg, #0b3d91, #1a73e8); color: #fff; font: 700 64px 'Oswald'; display: flex; align-items: center; justify-content: space-between; padding: 0 50px; letter-spacing: 2px; }
  #hdr small { font: 700 36px 'Oswald'; opacity: .85; }
  .city { font: 700 40px 'Oswald'; color: #fff; text-shadow: 2px 2px 0 #0008; display: flex; align-items: center; gap: 12px; }
  .city b { background: #ffd400; color: #111; padding: 0 12px; border-radius: 8px; font-size: 52px; }
  .city i { width: 18px; height: 18px; background: #fff; border-radius: 50%; border: 4px solid #111; }
  .hl { font: 700 150px 'Oswald'; color: #fff; text-shadow: 0 0 20px #0008; }
  #cyc { left: 0; top: 0; width: 520px; height: 520px; }
  #cyc .sp { position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.75) 0 12deg, transparent 12deg 40deg);
    -webkit-mask: radial-gradient(circle, transparent 22%, #000 30%, transparent 70%); mask: radial-gradient(circle, transparent 22%, #000 30%, transparent 70%); }
  #cyc .cg { position: absolute; left: 50%; top: 50%; width: 236px; height: 420px; margin: -250px 0 0 -118px; transform-origin: 50% 60%; }
  .dog { width: 150px; height: 60px; }
  .dog::before { content: ''; position: absolute; inset: 10px 0; background: #e8b26a; border-radius: 30px; box-shadow: inset 0 -6px 0 #c98a3d; }
  .dog::after { content: ''; position: absolute; left: -10px; right: -10px; top: 18px; height: 24px; background: #b8452e; border-radius: 12px; box-shadow: inset 0 4px 0 #d9654a; }
  #anchor { left: -70px; bottom: 380px; width: 400px; }
  #pointer { left: 250px; bottom: 820px; width: 360px; height: 12px; background: #ddd; border-radius: 6px; transform-origin: 0 50%; box-shadow: 0 2px 6px #0006; }
  #warn { right: 40px; top: 1160px; width: 330px; background: #fff; border: 8px solid #e01e1e; border-radius: 18px; padding: 14px; font: 700 34px 'Oswald'; color: #e01e1e; text-align: center; }
  #warn img { width: 160px; margin: 0 auto 4px; }
  #band { left: 0; right: 0; bottom: 260px; height: 120px; background: #0b3d91; color: #fff; font: 700 54px 'Oswald'; display: flex; align-items: center; padding-left: 40px; white-space: nowrap; overflow: hidden; }
  #flash { background: #fff; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="7.2727" data-width="1080" data-height="1920">
  <audio id="music" data-start="0" data-duration="7.2727" data-track-index="9" src="audio/07.mp3"></audio>
  <svg id="map" class="abs" viewBox="0 0 1080 1920">
    <defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a6fd6"/><stop offset="1" stop-color="#174a9c"/></linearGradient></defs>
    <rect width="1080" height="1920" fill="url(#sea)"/>
    <path id="land" d="M210 360 C330 300 470 330 560 300 C680 260 820 330 860 450 C900 560 980 620 960 760 C940 900 1000 1000 930 1120 C860 1240 900 1340 800 1420 C690 1500 560 1460 470 1520 C360 1590 250 1520 210 1400 C170 1290 90 1230 120 1100 C150 970 70 880 120 760 C170 640 110 520 160 440 Z" fill="#5fb85a" stroke="#e9f5e2" stroke-width="6"/>
    <g id="iso" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="5">
      <ellipse cx="420" cy="800" rx="170" ry="120"/><ellipse cx="420" cy="800" rx="290" ry="210"/><ellipse cx="420" cy="800" rx="420" ry="310"/>
      <ellipse cx="760" cy="1250" rx="120" ry="90"/><ellipse cx="760" cy="1250" rx="230" ry="170"/>
    </g>
    <g id="front"></g>
  </svg>
  <div id="hdr" class="abs">GROSSWETTERLAGE<small>MINOVERSE · SA 24.10.</small></div>
  <div class="abs hl" style="left:370px;top:700px">H</div>
  <div class="abs hl" style="left:720px;top:1160px;color:#ffd0d0">T</div>
  <div class="abs city" style="left:250px;top:440px"><i></i>Bassstadt <b>132°</b></div>
  <div class="abs city" style="left:560px;top:620px"><i></i>Minoburg <b>140°</b></div>
  <div class="abs city" style="left:200px;top:1000px"><i></i>Hi-Hat-Hausen <b>128°</b></div>
  <div id="cyc" class="abs"><div class="sp"></div><div class="cg sprite"></div></div>
  <div id="dogs" class="clip"></div>
  <div id="warn" class="abs"><img src="assets/pg.svg" alt="">PEPSI-GEYSIR<br>WARNSTUFE ROT</div>
  <img id="anchor" class="abs" src="assets/mm_anchor.webp" alt="">
  <div id="pointer" class="abs"></div>
  <div id="band" class="abs"><span id="bandTxt" style="display:inline-block">SPEED-GARAGE-FRONT AUS WESTEN · VEREINZELT HOTDOGS (VEGAN)</span></div>
  <div id="flash" class="clip"></div>
</div>
<script>
  const DROP = MV.BAR * 2;
  const tl = gsap.timeline({ paused: true });
  tl.from('#hdr', { y: -200, duration: 0.4, ease: 'power3.out' }, 0);
  tl.from('.city', { scale: 0, stagger: MV.BEAT, duration: 0.25, ease: 'back.out(3)' }, MV.b(1));
  tl.from('#warn', { x: 500, duration: 0.3, ease: 'back.out(2)' }, MV.b(6));
  tl.from('#pointer', { scaleX: 0, duration: 0.3 }, MV.b(2));
  tl.to('#pointer', { rotation: -35, duration: 0.3 }, MV.b(6));
  tl.to('#pointer', { rotation: 15, duration: 0.3 }, DROP + MV.b(2));
  tl.to('#flash', { opacity: 1, duration: 0.02 }, DROP - 0.2).to('#flash', { opacity: 0, duration: 0.08 }, DROP - 0.16)
    .to('#flash', { opacity: 1, duration: 0.02 }, DROP - 0.05).to('#flash', { opacity: 0, duration: 0.4 }, DROP);
  tl.set('#bandTxt', { textContent: 'UNWETTERWARNUNG: CHICKEN GUY ÜBER BASSSTADT GESICHTET' }, DROP);
  // Front mit Dreiecken
  const front = document.getElementById('front');
  front.innerHTML = '<path d="M-200 300 C 0 700, -100 1100, 100 1600" stroke="#1a3cff" stroke-width="12" fill="none"/>' +
    Array.from({ length: 10 }, (_, i) => `<polygon points="0,-30 30,10 -30,10" fill="#1a3cff" transform="translate(${-150 + i * 22 + Math.sin(i) * 60} ${360 + i * 130}) rotate(70)"/>`).join('');
  const cyc = document.getElementById('cyc');
  const cgS = MV.sprite(cyc.querySelector('.cg'), MV.CG);
  const dogs = document.getElementById('dogs'); const D = [];
  for (let i = 0; i < 26; i++) { const d = document.createElement('div'); d.className = 'abs dog'; dogs.appendChild(d); D.push(d); }
  const iso = document.getElementById('iso'), land = document.getElementById('land');
  MV.onFrame((t) => {
    const after = t >= DROP;
    const p = MV.pulse(t, 6);
    document.getElementById('bandTxt').style.transform = `translateX(${-Math.max(0, ((after ? t - DROP : t) - 0.8)) * 260}px)`;
    front.setAttribute('transform', `translate(${t * 70} 0)`);
    // Zyklon zieht ueber die Karte, Chicken Guy im Auge
    const cx = after ? 200 + (t - DROP) * 120 : 560, cy = after ? 560 + Math.sin(t * 2) * 60 : 520;
    cyc.style.left = cx - 260 + 'px'; cyc.style.top = cy - 260 + 'px';
    cyc.style.opacity = t > MV.b(4) ? 1 : 0;
    cyc.querySelector('.sp').style.transform = `rotate(${-t * 260}deg)`;
    cyc.querySelector('.cg').style.transform = `rotate(${after ? t * 400 : Math.sin(t * 5) * 15}deg) scale(.8)`;
    cgS(t * 10);
    iso.style.stroke = after ? `hsl(${(t * 220) % 360} 100% 65%)` : '';
    iso.setAttribute('stroke-width', after ? 5 + 12 * p : 5);
    land.style.fill = after ? `hsl(${(120 + t * 80) % 360} 70% 55%)` : '#5fb85a';
    D.forEach((d, i) => {
      const h = MV.hash(i + 2), h2 = MV.hash(i + 77);
      const start = (i < 8 ? 0.6 : DROP) + h * MV.BAR;
      const tt = t - start;
      d.style.opacity = tt > 0 ? 1 : 0;
      d.style.left = 60 + h2 * 900 + Math.sin(tt * 3 + i) * 30 + 'px';
      d.style.top = -80 + ((tt * (500 + 300 * h)) % 2000) + 'px';
      d.style.transform = `rotate(${60 + tt * 200 * (h - 0.5)}deg)`;
    });
  });
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = tl;
  MV.register('main', tl);
</script>
</body>
</html>
