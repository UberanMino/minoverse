<!doctype html>
<html lang="de" data-resolution="portrait">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>08 Frittiert</title>
<link rel="stylesheet" href="lib/base.css">
<script src="lib/gsap.min.js"></script>
<script src="lib/mv.js"></script>
<style>
  #bg { background: repeating-conic-gradient(from 0deg at 50% 45%, #ff2a00 0 10deg, #ffcc00 10deg 20deg); }
  #fry { transform-origin: 50% 45%; }
  #anchor { left: 90px; top: 420px; width: 900px; }
  #cg { left: 640px; top: 1020px; width: 360px; height: 640px; }
  #pg { left: 30px; top: 1180px; width: 300px; }
  .flare { width: 360px; height: 360px; margin: -180px 0 0 -180px; opacity: 0;
    background: radial-gradient(circle, #fff 0 6%, rgba(255,40,40,.95) 10%, rgba(255,0,0,.35) 28%, transparent 55%),
      linear-gradient(90deg, transparent 47%, #fff 50%, transparent 53%), linear-gradient(0deg, transparent 48%, #fff 50%, transparent 52%);
    mix-blend-mode: screen; }
  .meme { left: 0; right: 0; text-align: center; font: 400 150px 'Anton', 'Archivo Black', sans-serif; color: #fff; text-transform: uppercase; line-height: 1;
    -webkit-text-stroke: 10px #000; paint-order: stroke fill; letter-spacing: 2px; }
  #top { top: 150px; } #bot { top: 1520px; font-size: 120px; }
  .ring { width: 420px; height: 420px; border: 16px solid #ff0000; border-radius: 50%; opacity: 0; }
  .arrow { width: 260px; height: 40px; background: #ff0000; opacity: 0; transform-origin: 100% 50%; }
  .arrow::after { content: ''; position: absolute; right: -50px; top: -40px; border-left: 70px solid #ff0000; border-top: 60px solid transparent; border-bottom: 60px solid transparent; }
  #grain { width: 1080px; height: 1920px; mix-blend-mode: overlay; opacity: 0; }
  #lvl { right: 30px; top: 40px; font: 400 40px 'Anton'; color: #fff; background: #000; padding: 6px 18px; transform: rotate(3deg); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="deep" color-interpolation-filters="sRGB">
    <feConvolveMatrix order="3" kernelMatrix="0 -1 0 -1 5 -1 0 -1 0" preserveAlpha="true" result="sh"/>
    <feComponentTransfer in="sh"><feFuncR type="discrete" tableValues="0 .25 .5 .75 1"/><feFuncG type="discrete" tableValues="0 .25 .5 .75 1"/><feFuncB type="discrete" tableValues="0 .25 .5 .75 1"/></feComponentTransfer>
  </filter>
</svg>
<div id="root" data-composition-id="main" data-start="0" data-duration="7.2727" data-width="1080" data-height="1920">
  <audio id="music" data-start="0" data-duration="7.2727" data-track-index="9" src="audio/08.mp3"></audio>
  <div id="fry" class="clip">
    <div id="bg" class="clip"></div>
    <img id="anchor" class="abs" src="assets/mm_anchor.webp" alt="">
    <div id="cg" class="sprite"></div>
    <img id="pg" class="abs" src="assets/pg.svg" alt="">
    <div class="abs flare" id="f1" style="left:395px;top:860px"></div>
    <div class="abs flare" id="f2" style="left:655px;top:860px"></div>
    <div class="abs ring" id="ring" style="left:610px;top:1050px"></div>
    <div class="abs arrow" id="arr" style="left:300px;top:1250px;transform:rotate(-20deg)"></div>
    <div id="top" class="abs meme">BRUDER.</div>
    <div id="bot" class="abs meme">WO IST<br>CHICKEN GUY</div>
  </div>
  <canvas id="grain" class="clip"></canvas>
  <div id="lvl" class="abs">FRITTIERSTUFE 1/4</div>
</div>
<script>
  const DROP = MV.BAR * 2;
  const tl = gsap.timeline({ paused: true });
  tl.from('#top', { scale: 3, opacity: 0, duration: 0.12, ease: 'power4.in' }, 0.2);
  tl.from('#bot', { scale: 3, opacity: 0, duration: 0.12, ease: 'power4.in' }, MV.b(4));
  tl.set('.flare', { opacity: 1 }, DROP);
  tl.set('#ring', { opacity: 1 }, DROP + MV.b(1)).set('#arr', { opacity: 1 }, DROP + MV.b(1.5));
  tl.set('#top', { textContent: 'WAS.' }, DROP + MV.b(4));
  tl.set('#pg', { opacity: 0 }, 0).set('#pg', { opacity: 1 }, DROP + MV.b(2));
  MV.grain(document.getElementById('grain'), { w: 270, h: 480, alpha: 255, seed: 9 });
  const cgS = MV.sprite(document.getElementById('cg'), MV.CG);
  const fry = document.getElementById('fry'), grain = document.getElementById('grain'), lvl = document.getElementById('lvl');
  const flares = [...document.querySelectorAll('.flare')], bg = document.getElementById('bg');
  MV.onFrame((t) => {
    const bar = Math.min(3, Math.floor(t / MV.BAR));
    const level = bar + 1; // Frittierstufe steigt jeden Takt
    lvl.textContent = `FRITTIERSTUFE ${level}/4`;
    const p = MV.pulse(t, 9);
    const sat = [1.5, 2.2, 3, 3.8][bar], con = [1.1, 1.4, 1.7, 2.1][bar];
    fry.style.filter = `${level >= 3 ? 'url(#deep) ' : ''}saturate(${sat}) contrast(${con}) brightness(${1.05 + 0.1 * bar})`;
    grain.style.opacity = [0.1, 0.25, 0.45, 0.6][bar];
    // Zoom-Punch auf jedem Schlag, Wackelkamera
    const bi = MV.beatIndex(t);
    const punch = 1 + (level >= 2 ? 0.12 : 0.04) * p;
    fry.style.transform = `scale(${punch}) translate(${(MV.hash(bi) - 0.5) * 40 * p * level}px, ${(MV.hash(bi + 3) - 0.5) * 40 * p * level}px) rotate(${(MV.hash(bi + 9) - 0.5) * 4 * level * p}deg)`;
    bg.style.transform = `rotate(${t * 30}deg) scale(2)`;
    flares.forEach((f) => (f.style.transform = `scale(${1 + 0.6 * p}) rotate(${t * 90}deg)`));
    cgS(t * 12);
  });
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = tl;
  MV.register('main', tl);
</script>
</body>
</html>
