<!doctype html>
<html lang="de" data-resolution="portrait">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>02 Museum-Fieber</title>
<link rel="stylesheet" href="lib/base.css">
<script src="lib/gsap.min.js"></script>
<script src="lib/mv.js"></script>
<style>
  #wall { background:
      radial-gradient(60% 40% at 50% 28%, rgba(255,220,160,.35), transparent 70%),
      radial-gradient(circle at 25% 25%, #6b1020 2px, transparent 3px) 0 0/60px 60px,
      radial-gradient(circle at 75% 75%, #6b1020 2px, transparent 3px) 0 0/60px 60px,
      linear-gradient(#4a0b16, #2a050c); }
  #floor { left: 0; right: 0; bottom: 0; height: 330px; background: repeating-linear-gradient(90deg, #3b2414 0 120px, #2f1c10 120px 240px); box-shadow: inset 0 30px 60px rgba(0,0,0,.7); }
  #frame { left: 110px; top: 280px; width: 860px; height: 1080px; padding: 46px;
    background: linear-gradient(135deg, #f7d77a, #a8781e 30%, #ffe9a8 50%, #8a5a12 70%, #f1c85b);
    box-shadow: 0 30px 80px rgba(0,0,0,.8), inset 0 0 0 10px rgba(80,40,0,.35), inset 0 0 0 22px rgba(255,240,190,.35); }
  #canvasArea { position: relative; width: 100%; height: 100%; overflow: hidden; box-shadow: inset 0 0 0 6px #3a2208; }
  #paint { filter: url(#oil); }
  #sky { background: radial-gradient(70% 45% at 60% 25%, #f3d9a0, #b9894a 40%, #4d3216 75%, #1d1208); }
  #hills { left: -40px; right: -40px; bottom: -40px; height: 420px; background: radial-gradient(80% 100% at 30% 100%, #2c3313, #151a08 70%); border-radius: 50% 50% 0 0; }
  #halo { left: 50%; top: 150px; width: 300px; height: 300px; margin-left: -150px; border-radius: 50%; border: 14px solid rgba(255,214,92,.9); box-shadow: 0 0 60px 10px rgba(255,200,80,.7), inset 0 0 40px rgba(255,220,120,.6); }
  #cg { left: 50%; top: 170px; width: 420px; height: 748px; margin-left: -210px; transform-origin: 50% 100%; }
  #crack { background: repeating-linear-gradient(37deg, transparent 0 38px, rgba(30,15,0,.18) 38px 40px), repeating-linear-gradient(-53deg, transparent 0 51px, rgba(30,15,0,.16) 51px 53px); mix-blend-mode: multiply; pointer-events: none; }
  #varnish { background: radial-gradient(80% 60% at 50% 40%, rgba(255,230,160,.0), rgba(60,30,0,.45)); pointer-events: none; }
  .cherub { width: 170px; height: 150px; }
  .cherub img { position: absolute; left: 45px; top: 10px; width: 80px; }
  .cherub i { position: absolute; top: 40px; width: 80px; height: 50px; background: #fff8e8; border-radius: 80% 20% 70% 30%; box-shadow: inset -6px -6px 0 rgba(200,180,140,.6); }
  .cherub i.l { left: 0; transform-origin: 100% 50%; }
  .cherub i.r { right: 0; border-radius: 20% 80% 30% 70%; transform-origin: 0 50%; }
  #small { right: 40px; top: 40px; width: 170px; height: 215px; border-radius: 50%; padding: 18px; background: linear-gradient(135deg, #f7d77a, #8a5a12 60%, #f1c85b); box-shadow: 0 16px 40px rgba(0,0,0,.7); }
  #small div { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: radial-gradient(#5a4a2a, #1e160a); }
  #small img { width: 100%; margin-top: 18px; filter: sepia(.7) contrast(1.1); }
  #plaque { left: 120px; top: 1410px; width: 480px; padding: 22px 28px; background: #efe6d2; color: #2a1d10; box-shadow: 0 8px 24px rgba(0,0,0,.6); font-family: 'IM Fell English', serif; }
  #plaque b { display: block; font: 900 30px 'Cinzel'; letter-spacing: 2px; }
  #plaque p { font-size: 34px; line-height: 1.15; margin-top: 6px; }
  #plaque small { display: block; font-size: 24px; margin-top: 8px; color: #6b5a40; }
  #guard { right: -70px; bottom: 0; width: 330px; }
  #guardTag { right: 30px; bottom: 90px; font: 700 28px 'Oswald'; background: #111; color: #f1c85b; padding: 4px 14px; letter-spacing: 2px; }
  #gold { pointer-events: none; }
  #gold span { position: absolute; width: 22px; height: 14px; background: linear-gradient(135deg, #fff2b0, #c8921e); }
  #flash { background: #ffe9a8; opacity: 0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="oil" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence id="oT" type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap id="oD" in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="B" result="d"/>
    <feColorMatrix in="d" type="matrix" values="1.05 .15 0 0 .02  .05 .95 .05 0 0  0 .1 .7 0 0  0 0 0 1 0"/>
  </filter>
</svg>
<div id="root" data-composition-id="main" data-start="0" data-duration="7.2727" data-width="1080" data-height="1920">
  <audio id="music" data-start="0" data-duration="7.2727" data-track-index="9" src="audio/02.mp3"></audio>
  <div id="wall" class="clip"></div>
  <div id="floor" class="abs"></div>
  <div id="small" class="abs"><div><img src="assets/pg.svg" alt=""></div></div>
  <div id="frame" class="abs">
    <div id="canvasArea">
      <div id="paint" class="clip">
        <div id="sky" class="clip"></div>
        <div id="hills" class="abs"></div>
        <div id="halo" class="abs"></div>
        <div id="cg" class="sprite"></div>
      </div>
      <div id="crack" class="clip"></div>
      <div id="varnish" class="clip"></div>
    </div>
  </div>
  <div id="plaque" class="abs"><b>UNBEKANNTER MEISTER</b><p>Der Hühnermann, um 1640</p><small>Öl auf Frittierfett · Leihgabe des Minoverse</small></div>
  <img id="guard" class="abs" src="assets/mm_anchor.webp" alt="">
  <div id="guardTag" class="abs">AUFSICHT · MINO MAN</div>
  <div id="cherubs" class="clip"></div>
  <div id="gold" class="clip"></div>
  <div id="flash" class="clip"></div>
</div>
<script>
  const DROP = MV.BAR * 2;
  const tl = gsap.timeline({ paused: true });
  // Kamerafahrt auf das Gemaelde (langsam, museal)
  tl.fromTo('#frame', { scale: 0.92 }, { scale: 1, duration: DROP, ease: 'sine.inOut' }, 0);
  tl.from('#plaque', { opacity: 0, y: 30, duration: 0.6 }, 0.5);
  tl.to('#flash', { opacity: 0.9, duration: 0.04 }, DROP - 0.02).to('#flash', { opacity: 0, duration: 0.5 }, DROP + 0.02);
  tl.to('#plaque', { rotation: -9, y: 40, duration: 0.5, ease: 'bounce.out' }, DROP + 0.1);

  const cgS = MV.sprite(document.getElementById('cg'), MV.CG);
  // Cherubim: Chicken-Guy-Koepfe mit Fluegeln
  const ch = document.getElementById('cherubs');
  const cherubs = [];
  for (let i = 0; i < 6; i++) {
    const c = document.createElement('div');
    c.className = 'abs cherub';
    c.innerHTML = '<i class="l"></i><i class="r"></i><img src="assets/cg_head.webp" alt="">';
    ch.appendChild(c); cherubs.push(c);
  }
  // Blattgold-Partikel
  const gold = document.getElementById('gold');
  const flakes = [];
  for (let i = 0; i < 40; i++) { const s = document.createElement('span'); gold.appendChild(s); flakes.push(s); }

  const oD = document.getElementById('oD'), oT = document.getElementById('oT');
  const frame = document.getElementById('frame'), halo = document.getElementById('halo'), paint = document.getElementById('paint');
  MV.onFrame((t) => {
    const after = t >= DROP;
    const k = after ? (t - DROP) / (MV.DUR - DROP) : 0;
    const p = MV.pulse(t, 7);
    // Vor dem Drop: Gemaelde steht still (ein Frame). Danach tanzt es.
    cgS(after ? t * 10 : 12);
    oD.setAttribute('scale', after ? 14 + 50 * k + 30 * p : 9);
    oT.setAttribute('baseFrequency', after ? (0.02 + 0.015 * Math.sin(t * 2)).toFixed(4) : '0.035');
    paint.style.filter = after ? `url(#oil) saturate(${1 + k * 1.6}) hue-rotate(${k * k * 110}deg)` : 'url(#oil)';
    frame.style.translate = after ? `${(MV.hash(MV.beatIndex(t)) - 0.5) * 24 * p}px 0` : '0 0';
    halo.style.transform = `scale(${1 + (after ? 0.25 * p : 0)}) rotate(${t * 40}deg)`;
    halo.style.borderStyle = after ? 'dashed' : 'solid';
    cherubs.forEach((c, i) => {
      const on = after && t > DROP + i * MV.BEAT * 0.5;
      c.style.opacity = on ? 1 : 0;
      const a = (t - DROP) * (1.2 + i * 0.15) + i * 1.05;
      c.style.left = 450 + Math.cos(a) * (360 + 20 * i) - 85 + 'px';
      c.style.top = 760 + Math.sin(a * 1.3) * (520 - 30 * i) - 75 + 'px';
      const flap = Math.sin(t * 30 + i) * 35;
      c.children[0].style.transform = `rotate(${flap}deg)`;
      c.children[1].style.transform = `rotate(${-flap}deg)`;
    });
    flakes.forEach((s, i) => {
      const h = MV.hash(i + 1), h2 = MV.hash(i + 99);
      const tt = after ? (t - DROP) : -1;
      s.style.opacity = tt < 0 ? 0 : 1;
      s.style.left = 80 + h * 920 + Math.sin(tt * 3 + i) * 40 + 'px';
      s.style.top = -40 + ((tt * (220 + 260 * h2) + h * 1900) % 1960) + 'px';
      s.style.transform = `rotate(${tt * 300 * (h - 0.5)}deg) scaleX(${Math.cos(tt * 8 + i)})`;
    });
  });
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = tl;
  MV.register('main', tl);
</script>
</body>
</html>
